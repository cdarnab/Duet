<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Duet — people</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<main class="wrap wrap-wide">
  <p class="eyebrow"><a href="/">Back</a> · Owner</p>
  <h1>People</h1>
  <p class="lede">Invite someone, then send the link by Messages or email. Duet does not send mail itself.</p>

  <section class="card">
    <p class="eyebrow">New invite</p>
    <h2 style="margin-top:6px">Create a one-week link</h2>
    <form id="invite-form" class="invite-form">
      <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
      <button class="btn primary" type="submit">Create invite</button>
    </form>
    <p class="small" id="invite-error" style="margin:12px 0 0;color:var(--rose)"></p>
    <div class="share-panel" id="share-panel" hidden></div>
  </section>

  <section class="card">
    <p class="eyebrow">Directory</p>
    <h2 style="margin-top:6px">Members</h2>
    <div id="members" class="people-list"></div>
  </section>

  <section class="card">
    <p class="eyebrow">Waiting</p>
    <h2 style="margin-top:6px">Pending invites</h2>
    <div id="pending" class="people-list"></div>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
