<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Duet — reset password</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Password reset</p>
  <h1>Choose a new password</h1>
  <p class="lede">This link is single-use and expires in 24 hours. Use at least 12 characters.</p>
  <form class="card" id="form">
    <label class="small" for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" />
    <button class="btn primary wide" style="margin-top:14px" type="submit">Save password</button>
    <p class="small" id="error" style="margin:12px 0 0;color:var(--rose)"></p>
  </form>
</main>
<script>
  document.getElementById('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = document.getElementById('error');
    error.textContent = '';
    const res = await fetch(location.pathname, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      error.textContent = body.error === 'weak_password'
        ? 'Use at least 12 characters.'
        : 'This reset link is invalid or already used.';
      return;
    }
    location.href = body.disabled ? '/login' : '/';
  });
</script>
</body>
</html>
