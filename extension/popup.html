<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ink:#0a0e1a; --velvet:#141b30; --haze:#232c4a;
    --lamp:#f5c36b; --paper:#e8e6f0; --dim:#8a90a8; --good:#7fd1a8;
  }
  body {
    width: 296px; margin: 0; padding: 16px;
    background: var(--ink); color: var(--paper);
    font: 400 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  h1 { font: 400 24px/1 Didot, Georgia, serif; margin: 0 0 2px; }
  .eyebrow { font: 500 10px/1 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 12px 0 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--haze); background: #070a13; color: var(--paper);
    font: 400 14px/1 ui-monospace, monospace;
  }
  button {
    width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--haze); background: var(--velvet); color: var(--paper);
    font: 500 14px/1 ui-sans-serif, system-ui, sans-serif;
  }
  button.primary { background: var(--lamp); border-color: var(--lamp); color: #1a1206; }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 13px; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4a5170; }
  .dot.on { background: var(--good); }
  .readout { font: 400 12px/1.6 ui-monospace, monospace; color: var(--dim); margin-top: 8px; }
  .readout b { color: var(--paper); font-weight: 500; }
  a { color: var(--lamp); font-size: 12px; }
</style>
</head>
<body>
  <p class="eyebrow">Duet · 1.4.0</p>
  <h1>Watch together</h1>

  <label for="room">Room code</label>
  <input id="room" type="text" placeholder="6-letter code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" />

  <button class="primary" id="join">Join room</button>
  <button id="cue">Count us in</button>
  <button id="resync">Resync</button>
  <button id="leave">Leave</button>

  <div class="status"><span class="dot" id="dot"></span><span id="status-text">Not connected</span></div>
  <div class="readout" id="readout"></div>
  <p><a href="#" id="console-link" target="_blank">Open the console for voice and chat</a></p>
  <p id="login-wrap" style="display:none"><a id="login-link" href="https://duet.arnabbanik.com/login" target="_blank">Log in on Duet first</a></p>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
